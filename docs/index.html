<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>IDK.org</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="logo">IDK.org</div>
    <p class="tag">Intellect Driven Knowledge</p>
  </div>
  <div id="message" class="card" style="display:none;" role="status"></div>
  <div id="login" class="card">
    <div class="seg" role="tablist" aria-label="Log in or create an account">
      <button type="button" id="tabLogin" class="seg-btn active" role="tab" aria-selected="true">Log in</button>
      <button type="button" id="tabRegister" class="seg-btn" role="tab" aria-selected="false">Create account</button>
    </div>
    <h2 id="loginTitle">Welcome back</h2>
    <p class="sub" id="loginSub">Find how you learn best in 2 minutes.</p>
    <form id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <input type="text" id="name" placeholder="Your name" autocomplete="name" />
        <div class="err" id="nameErr" role="alert"></div>
      </div>
      <div class="field">
        <input type="email" id="email" placeholder="Email" autocomplete="email" />
        <div class="err" id="emailErr" role="alert"></div>
      </div>
      <div class="field">
        <div class="pw">
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
          <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <div class="err" id="passwordErr" role="alert"></div>
      </div>
      <div class="field" id="confirmField" hidden>
        <input type="password" id="confirm" placeholder="Confirm password" autocomplete="new-password" />
        <div class="err" id="confirmErr" role="alert"></div>
      </div>
      <button type="submit" id="authBtn">Log in</button>
    </form>
  </div>
  <div id="quiz" class="card" style="display:none;">
    <h2>Find your Learnprint</h2>
    <div class="progress-row">
      <progress id="quizBar" value="0" max="15"></progress>
      <div class="count" id="quizProgress"></div>
    </div>
    <div id="quizQuestion" class="q-wrap"></div>
    <button id="nextBtn" disabled>Next</button>
  </div>
  <div id="result" class="card" style="display:none;">
    <div class="learnprint-head">
      <div class="kicker">Your</div>
      <h2>Learnprint</h2>
    </div>
    <div id="radarChart"></div>
    <div id="resultText"></div>
    <button id="shareBtn">Share my Learnprint</button>
    <button id="toTutorBtn" class="ghost">Continue</button>
    <button id="retakeBtn" class="ghost">Retake the quiz</button>
  </div>
  <div id="tutor" class="card" style="display:none;">
    <h2>Study coach</h2>
    <div class="chat" id="chat"></div>
    <input type="text" id="msgInput" placeholder="Ask a question…" />
    <button id="sendBtn">Send</button>
    <div class="chips" id="suggestions"></div>
  </div>
  <div id="menu" class="card" style="display:none;">
    <div class="menu">
      <button id="learnprintBtn">My Learnprint</button>
      <button id="tutorBtn" class="ghost">Study coach</button>
      <button id="againBtn" class="ghost">Take Quiz Again</button>
      <button id="logoutBtn" class="ghost">Log out</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
